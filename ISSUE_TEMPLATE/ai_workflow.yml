name: AI workflow task
description: Define work for RAG, agents, prompts, tools, evaluation, or guardrails.
title: "ai: "
labels: ["ai-workflow", "needs-triage"]
body:
  - type: dropdown
    id: repository_area
    attributes:
      label: Target repository
      options:
        - ai-orchestration
        - agrotutor
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should the AI workflow do?
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      description: User inputs, documents, retrieved data, tools, or APIs.
  - type: textarea
    id: outputs
    attributes:
      label: Expected outputs
      description: Response structure, JSON schema, advisory content, or tool result.
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation method
      description: Test cases, metrics, manual review, or acceptance threshold.
  - type: textarea
    id: guardrails
    attributes:
      label: Guardrails and risks
      description: Safety, privacy, hallucination, bias, or human review requirements.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Prompt or agent documented
        - [ ] Evaluation cases added
        - [ ] Guardrails documented
        - [ ] Tests pass
    validations:
      required: true
