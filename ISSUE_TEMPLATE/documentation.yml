name: Documentation task
description: Request or improve documentation.
title: "docs: "
labels: ["documentation", "needs-triage"]
body:
  - type: dropdown
    id: repository_area
    attributes:
      label: Target area
      options:
        - e-agrology
        - hfms
        - agrotutor
        - ai-orchestration
        - engineering-playbook
        - .github
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Documentation gap
      description: What is missing, unclear, or outdated?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected update
    validations:
      required: true
