name: Feature request
description: Propose a new feature or enhancement.
title: "feat: "
labels: ["feature", "needs-triage"]
body:
  - type: dropdown
    id: repository_area
    attributes:
      label: Target area
      options:
        - e-agrology
        - hfms
        - agrotutor
        - ai-orchestration
        - engineering-playbook
        - .github
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should this feature achieve?
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Users or stakeholders
      description: Who needs this and why?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: APIs, schemas, screens, data sources, or dependencies.
